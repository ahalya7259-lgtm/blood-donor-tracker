spring.application.name=blood-donor-tracker

spring.datasource.url=jdbc:h2:mem:blooddb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

# Configurable demo settings — NOT medical advice
app.donation.min-gap-days=90
app.donor.min-age=18
app.donor.max-age=65
app.stock.low-threshold=3
app.stock.expiry-warning-days=7

app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD:ChangeMe123}
